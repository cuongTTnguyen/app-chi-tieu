<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ghi nợ · Sổ chi tiêu CL</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Quicksand','sans-serif']},colors:{brand:{primary:'#8b5cf6'}}}}}</script><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"><style>.debt-card{animation:fb-content-enter .25s ease both}.field{width:100%;padding:.8rem;border-radius:1rem;background:#f1f5f9;border:1px solid #e2e8f0;color:#0f172a}.dark .field{background:#0f172a;border-color:#334155;color:#f8fafc}</style></head><body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen"><main class="max-w-4xl mx-auto p-4 md:p-8"><header class="flex items-center gap-3 mb-6"><a href="index.html" class="w-11 h-11 rounded-2xl bg-white dark:bg-slate-800 grid place-items-center shadow"><i class="fas fa-arrow-left"></i></a><div><h1 class="text-2xl font-extrabold">Sổ nợ</h1><p class="text-sm text-slate-500">Theo dõi khoản cho vay và đi vay của từng người</p></div></header>
<section class="grid sm:grid-cols-2 gap-3 mb-5"><div class="rounded-3xl p-5 bg-gradient-to-br from-emerald-500 to-teal-600 text-white"><p class="font-bold opacity-90">Người khác nợ mình</p><div id="owed-total" class="text-2xl font-extrabold mt-2">0đ</div></div><div class="rounded-3xl p-5 bg-gradient-to-br from-rose-500 to-pink-600 text-white"><p class="font-bold opacity-90">Mình đang nợ</p><div id="owe-total" class="text-2xl font-extrabold mt-2">0đ</div></div></section>
<section class="bg-white dark:bg-slate-800 rounded-3xl p-4 md:p-5 shadow-sm mb-5"><div class="flex flex-wrap items-center justify-between gap-3 mb-4"><h2 class="text-lg font-extrabold">Danh sách khoản nợ</h2><select id="filter-person" class="field max-w-[180px]"><option value="all">Cả Người A và B</option><option value="user1">Người A</option><option value="user2">Người B</option></select></div><div id="debt-list" class="space-y-3"></div></section>
<section class="bg-white dark:bg-slate-800 rounded-3xl p-4 md:p-5 shadow-sm"><h2 class="text-lg font-extrabold mb-4"><i class="fas fa-circle-plus text-violet-500 mr-2"></i>Thêm ghi nợ</h2><form id="debt-form" class="grid sm:grid-cols-2 gap-3"><div><label class="block text-sm font-bold mb-1">Loại khoản</label><select id="debt-kind" class="field"><option value="lend">Cho vay — người khác nợ mình</option><option value="borrow">Đi vay — mình nợ người khác</option></select></div><div><label class="block text-sm font-bold mb-1">Người ghi nhận khoản nợ</label><select id="debt-owner" class="field"><option value="user1">Người A</option><option value="user2">Người B</option></select></div><div><label class="block text-sm font-bold mb-1">Tên người nợ/vay</label><input id="debt-person" class="field" required maxlength="80" placeholder="Ví dụ: Anh Minh"></div><div><label class="block text-sm font-bold mb-1">Số tiền (VNĐ)</label><input id="debt-amount" class="field" type="number" min="1" step="1" required placeholder="500000"></div><div><label class="block text-sm font-bold mb-1">Ví/quỹ liên quan</label><select id="debt-fund" class="field"><option value="">Không trừ/cộng vào ví</option></select></div><div><label class="block text-sm font-bold mb-1">Ngày ghi nhận</label><input id="debt-date" type="date" class="field" required></div><div class="sm:col-span-2"><label class="block text-sm font-bold mb-1">Lý do (không bắt buộc)</label><input id="debt-reason" class="field" maxlength="180" placeholder="Ví dụ: mượn tiền sửa xe"></div><button class="sm:col-span-2 p-3 rounded-2xl bg-violet-600 hover:bg-violet-700 text-white font-extrabold" type="submit"><i class="fas fa-save mr-2"></i>Lưu khoản nợ</button></form><p class="text-xs text-slate-500 mt-3">Khoản vay sẽ ghi tăng số dư ví/quỹ đã chọn; khoản cho vay ghi giảm số dư ví/quỹ đó. Sổ nợ được lưu trên thiết bị và đưa vào đồng bộ Firebase cùng dữ liệu ứng dụng.</p></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="firebase-sync.js"></script><script>
(()=>{const KEY='finance_buddy_debts', TX='finance_buddy_transactions', FUNDS='finance_buddy_funds';const $=id=>document.getElementById(id);const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}};const money=n=>new Intl.NumberFormat('vi-VN').format(n)+'đ';const personName=id=>id==='user2'?'Người B':'Người A';let debts=read(KEY,[]);$('debt-date').value=new Date().toISOString().slice(0,10);function populateFunds(){const fs=read(FUNDS,[]);$('debt-fund').innerHTML='<option value="">Không trừ/cộng vào ví</option>'+fs.map(f=>`<option value="${String(f.id).replace(/"/g,'&quot;')}">${String(f.name).replace(/</g,'&lt;')}</option>`).join('')}function save(){localStorage.setItem(KEY,JSON.stringify(debts));window.FinanceCloudSync?.scheduleSync('debts');render()}function render(){const filter=$('filter-person').value;const shown=debts.filter(d=>filter==='all'||d.owner===filter);$('owed-total').textContent=money(shown.filter(d=>d.kind==='lend'&&!d.settled).reduce((s,d)=>s+d.amount,0));$('owe-total').textContent=money(shown.filter(d=>d.kind==='borrow'&&!d.settled).reduce((s,d)=>s+d.amount,0));$('debt-list').innerHTML=shown.length?shown.slice().reverse().map(d=>`<article class="debt-card border border-slate-200 dark:border-slate-700 rounded-2xl p-4 flex gap-3 justify-between"><div class="min-w-0"><div class="flex flex-wrap gap-2 items-center"><span class="text-xs font-extrabold px-2 py-1 rounded-lg ${d.kind==='lend'?'bg-emerald-100 text-emerald-700':'bg-rose-100 text-rose-700'}">${d.kind==='lend'?'Người khác nợ':'Mình đi vay'}</span><span class="text-xs text-slate-500">${personName(d.owner)}</span>${d.settled?'<span class="text-xs text-slate-500">Đã tất toán</span>':''}</div><h3 class="font-extrabold mt-2 break-words">${esc(d.person)}</h3><p class="text-sm text-slate-500 mt-1">${esc(d.reason||'Không ghi lý do')} · ${esc(d.date)}</p><p class="text-lg font-extrabold mt-1">${money(d.amount)}</p>${d.fundName?`<p class="text-xs text-slate-500 mt-1">Ví/quỹ: ${esc(d.fundName)}</p>`:''}</div><div class="flex flex-col gap-2 shrink-0"><button data-settle="${d.id}" class="px-3 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-700">${d.settled?'Mở lại':'Tất toán'}</button><button data-del="${d.id}" class="px-3 py-2 rounded-xl text-xs font-bold text-rose-600 bg-rose-50 dark:bg-rose-950/30">Xóa</button></div></article>`).join(''):'<p class="text-sm text-slate-500 text-center py-6">Chưa có khoản nợ nào phù hợp.</p>'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('filter-person').addEventListener('change',render);$('debt-list').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.settle){const d=debts.find(x=>x.id===b.dataset.settle);if(d){d.settled=!d.settled;save()}}if(b.dataset.del){if(confirm('Xóa khoản nợ này?')){debts=debts.filter(x=>x.id!==b.dataset.del);save()}}});$('debt-form').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('debt-amount').value);if(!(amount>0))return;const fs=read(FUNDS,[]),fund=fs.find(f=>String(f.id)===$('debt-fund').value);const d={id:'debt_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),kind:$('debt-kind').value,owner:$('debt-owner').value,person:$('debt-person').value.trim(),amount,reason:$('debt-reason').value.trim(),fundId:fund?.id||'',fundName:fund?.name||'',date:$('debt-date').value,settled:false};debts.push(d);if(fund){let tx=read(TX,[]);tx.unshift({id:'tx_'+Date.now(),type:d.kind==='borrow'?'income':'expense',amount,date:d.date,category:'debt',account:fund.id,note:(d.kind==='borrow'?'Vay từ ':'Cho vay: ')+d.person+(d.reason?' — '+d.reason:''),fundId:fund.id,fund:fund.name,workspace:d.owner,createdAt:Date.now(),debtId:d.id});localStorage.setItem(TX,JSON.stringify(tx))}save();e.target.reset();$('debt-date').value=new Date().toISOString().slice(0,10);populateFunds();});function dark(){const t=localStorage.getItem('finance_buddy_theme')||'system';document.documentElement.classList.toggle('dark',t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))}dark();populateFunds();render();})();
</script></body></html>
