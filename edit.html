<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập Dữ Liệu - Quản Lý Chi Tiêu</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Quicksand', 'sans-serif'] }, colors: { brand: { bgDark: '#0f172a', cardDark: '#1e293b', bgLight: '#f8fafc', cardLight: '#ffffff', primary: '#8b5cf6', primaryHover: '#7c3aed', expense: '#f43f5e', income: '#10b981' } }, boxShadow: { 'bubbly': '0 10px 25px -5px rgba(0, 0, 0, 0.1)', 'bubbly-dark': '0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3)' } } } }</script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-brand-bgLight text-slate-800 dark:bg-brand-bgDark dark:text-slate-200 h-[100dvh] flex overflow-hidden selection:bg-brand-primary selection:text-white">

    <main class="flex-1 flex flex-col h-full overflow-hidden relative bg-slate-50 dark:bg-slate-900/50">
        <!-- HEADER DÀNH RIÊNG CHO TRANG EDIT (Có nút Back) -->
        <header class="md:hidden flex items-center justify-center p-4 bg-brand-cardLight dark:bg-brand-cardDark shadow-sm z-20 rounded-b-3xl relative">
            <a href="index.html" class="absolute left-4 text-slate-600 dark:text-slate-300 text-xl btn-bouncy p-2">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="font-extrabold text-xl text-transparent bg-clip-text bg-gradient-to-r from-brand-primary to-pink-500">Finance Buddy</h1>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 relative scroll-smooth" id="main-scroll-area">
            <section class="max-w-2xl mx-auto animate-view">
                
                <div class="hidden md:flex items-center mb-8 bg-brand-cardLight dark:bg-brand-cardDark p-4 rounded-2xl shadow-sm">
                    <a href="index.html" class="w-12 h-12 rounded-xl bg-slate-100 dark:bg-slate-700 shadow flex items-center justify-center text-slate-600 dark:text-slate-300 hover:text-brand-primary hover:bg-slate-200 btn-bouncy mr-4 transition-colors"><i class="fas fa-arrow-left text-xl"></i></a>
                    <div><h2 class="font-extrabold text-2xl text-slate-800 dark:text-white leading-tight">Nhập Giao Dịch Mới</h2><p class="text-sm text-slate-500 dark:text-slate-400 font-medium">Ghi chép chi tiêu để quản lý tốt hơn</p></div>
                </div>

                <div class="bg-brand-cardLight dark:bg-brand-cardDark rounded-[2rem] p-6 md:p-10 shadow-bubbly dark:shadow-bubbly-dark border border-slate-100 dark:border-slate-800 relative overflow-hidden">
                    <i class="fas fa-pencil-alt absolute -top-10 -right-10 text-9xl text-slate-50 dark:text-slate-800/50 opacity-50 rotate-12 pointer-events-none"></i>

                    <form id="edit-form" onsubmit="handleFormSubmit(event)" class="relative z-10">
                        
                        <div class="flex bg-slate-100 dark:bg-slate-800 p-1.5 rounded-2xl mb-8 relative shadow-inner">
                            <div id="type-indicator" class="absolute inset-y-1.5 left-1.5 w-[calc(50%-6px)] bg-brand-expense rounded-xl transition-all duration-300 shadow-md"></div>
                            <button type="button" onclick="setEditType('expense')" id="edit-tab-expense" class="flex-1 py-3 text-base font-extrabold z-10 transition-colors text-white">🔥 Chi Tiêu</button>
                            <button type="button" onclick="setEditType('income')" id="edit-tab-income" class="flex-1 py-3 text-base font-extrabold z-10 transition-colors text-slate-500 dark:text-slate-400">💰 Thu Nhập</button>
                        </div>

                        <div class="mb-8 relative group">
                            <label class="block text-sm font-extrabold text-slate-500 dark:text-slate-400 mb-2 uppercase tracking-wide">Số Tiền Cần Nhập</label>
                            <div class="relative flex items-center">
                                <div class="absolute left-4 w-10 h-10 bg-slate-200 dark:bg-slate-700 rounded-xl flex items-center justify-center text-slate-600 dark:text-slate-300 font-bold text-xl transition-colors group-focus-within:bg-brand-primary group-focus-within:text-white">₫</div>
                                <input type="text" id="input-amount" required placeholder="0" class="w-full bg-slate-50 dark:bg-slate-900/50 border-2 border-slate-200 dark:border-slate-700 rounded-2xl py-5 pl-16 pr-6 text-4xl font-extrabold text-brand-primary focus:outline-none focus:border-brand-primary transition-all text-right shadow-inner placeholder-slate-300" oninput="formatCurrencyInput(this)">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                            <div>
                                <label class="block text-sm font-extrabold text-slate-500 dark:text-slate-400 mb-2 uppercase tracking-wide">Tài Khoản</label>
                                <div class="relative">
                                    <select id="input-account" class="w-full bg-slate-50 dark:bg-slate-900/50 border-2 border-slate-200 dark:border-slate-700 rounded-2xl py-3.5 pl-12 pr-4 text-slate-700 dark:text-slate-200 font-bold focus:outline-none focus:border-brand-primary appearance-none cursor-pointer transition-colors">
                                        <option value="main" selected>Tài Khoản Chính</option>
                                        <option value="cash">Tiền Mặt</option>
                                        <option value="savings">Quỹ Tiết Kiệm</option>
                                    </select>
                                    <i class="fas fa-wallet absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 text-lg"></i>
                                    <i class="fas fa-chevron-down absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-extrabold text-slate-500 dark:text-slate-400 mb-2 uppercase tracking-wide">Ngày Giao Dịch</label>
                                <div class="relative">
                                    <input type="date" id="input-date" required class="w-full bg-slate-50 dark:bg-slate-900/50 border-2 border-slate-200 dark:border-slate-700 rounded-2xl py-3.5 px-4 text-slate-700 dark:text-slate-200 font-bold focus:outline-none focus:border-brand-primary cursor-pointer transition-colors">
                                </div>
                            </div>
                        </div>

                        <div class="mb-8">
                            <div class="flex justify-between items-end mb-2">
                                <label class="block text-sm font-extrabold text-slate-500 dark:text-slate-400 uppercase tracking-wide">Chọn Danh Mục</label>
                                <button type="button" onclick="openAddCategoryModal()" class="text-xs font-bold text-brand-primary hover:text-brand-primaryHover flex items-center bg-brand-primary/10 px-2 py-1 rounded-lg"><i class="fas fa-plus mr-1"></i> Tạo mới</button>
                            </div>
                            <div id="category-grid" class="grid grid-cols-4 sm:grid-cols-5 gap-3 p-4 bg-slate-50 dark:bg-slate-900/50 rounded-2xl border-2 border-slate-100 dark:border-slate-800"></div>
                            <input type="hidden" id="input-category" required>
                            <p id="category-error" class="text-rose-500 text-sm font-bold mt-2 hidden flex items-center"><i class="fas fa-exclamation-circle mr-1"></i> Vui lòng chọn một danh mục!</p>
                        </div>

                        <div class="space-y-6 mb-8 bg-slate-50 dark:bg-slate-900/50 p-5 rounded-2xl border-2 border-slate-100 dark:border-slate-800">
                            <div>
                                <label class="block text-sm font-extrabold text-slate-500 dark:text-slate-400 mb-2 flex items-center"><i class="fas fa-hashtag mr-2 text-slate-400"></i> Thẻ (Tag)</label>
                                <input type="text" id="input-tag" placeholder="VD: dulich, tiectung..." class="w-full bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-600 rounded-xl py-3 px-4 text-slate-700 dark:text-slate-200 font-bold focus:outline-none focus:border-brand-primary transition-colors">
                            </div>
                            <div>
                                <label class="block text-sm font-extrabold text-slate-500 dark:text-slate-400 mb-2 flex items-center"><i class="fas fa-align-left mr-2 text-slate-400"></i> Ghi chú chi tiết</label>
                                <textarea id="input-note" rows="2" placeholder="Ghi chú thêm về khoản này..." class="w-full bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-600 rounded-xl py-3 px-4 text-slate-700 dark:text-slate-200 font-bold focus:outline-none focus:border-brand-primary resize-none transition-colors"></textarea>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-gradient-to-r from-brand-primary to-purple-600 hover:from-purple-600 hover:to-brand-primary text-white font-extrabold text-xl py-5 rounded-2xl shadow-[0_10px_20px_rgba(139,92,246,0.3)] transform hover:-translate-y-1 transition-all duration-300 btn-bouncy flex items-center justify-center pb-safe">
                            <i class="fas fa-check-circle mr-2 text-2xl"></i> HOÀN TẤT LƯU
                        </button>
                    </form>
                </div>
            </section>
        </div>

        <!-- MODAL THÊM DANH MỤC -->
        <div id="add-category-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
            <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeAddCategoryModal()"></div>
            <div class="bg-white dark:bg-slate-800 rounded-3xl w-full max-w-sm p-6 relative z-10 shadow-bubbly dark:shadow-bubbly-dark animate-view border border-slate-100 dark:border-slate-700">
                <h3 class="text-xl font-extrabold text-slate-800 dark:text-white mb-4">Tạo Danh Mục Mới</h3>
                <div class="mb-5">
                    <label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-2">Tên danh mục</label>
                    <input type="text" id="new-cat-name" placeholder="VD: Đổ xăng..." class="w-full bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 rounded-xl py-3 px-4 font-bold text-slate-800 dark:text-white focus:outline-none focus:border-brand-primary shadow-inner">
                </div>
                <div class="mb-5">
                    <label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-2">Biểu tượng</label>
                    <div class="flex flex-wrap gap-3">
                        <div class="icon-option selected w-11 h-11 rounded-xl flex items-center justify-center text-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 cursor-pointer" data-icon="fas fa-star" onclick="selectIconOption(this)"><i class="fas fa-star"></i></div>
                        <div class="icon-option w-11 h-11 rounded-xl flex items-center justify-center text-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 cursor-pointer" data-icon="fas fa-coffee" onclick="selectIconOption(this)"><i class="fas fa-coffee"></i></div>
                        <div class="icon-option w-11 h-11 rounded-xl flex items-center justify-center text-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 cursor-pointer" data-icon="fas fa-plane" onclick="selectIconOption(this)"><i class="fas fa-plane"></i></div>
                        <div class="icon-option w-11 h-11 rounded-xl flex items-center justify-center text-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 cursor-pointer" data-icon="fas fa-tshirt" onclick="selectIconOption(this)"><i class="fas fa-tshirt"></i></div>
                        <div class="icon-option w-11 h-11 rounded-xl flex items-center justify-center text-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 cursor-pointer" data-icon="fas fa-paw" onclick="selectIconOption(this)"><i class="fas fa-paw"></i></div>
                        <div class="icon-option w-11 h-11 rounded-xl flex items-center justify-center text-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 cursor-pointer" data-icon="fas fa-utensils" onclick="selectIconOption(this)"><i class="fas fa-utensils"></i></div>
                    </div>
                </div>
                <div class="mb-8">
                    <label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-2">Màu sắc</label>
                    <div class="flex flex-wrap gap-4">
                        <div class="color-option selected w-8 h-8 rounded-full bg-[#8b5cf6] cursor-pointer" data-color='{"color":"#8b5cf6","bg":"#ede9fe","text":"#7c3aed"}' onclick="selectColorOption(this)"></div>
                        <div class="color-option w-8 h-8 rounded-full bg-[#10b981] cursor-pointer" data-color='{"color":"#10b981","bg":"#d1fae5","text":"#059669"}' onclick="selectColorOption(this)"></div>
                        <div class="color-option w-8 h-8 rounded-full bg-[#3b82f6] cursor-pointer" data-color='{"color":"#3b82f6","bg":"#dbeafe","text":"#2563eb"}' onclick="selectColorOption(this)"></div>
                        <div class="color-option w-8 h-8 rounded-full bg-[#ec4899] cursor-pointer" data-color='{"color":"#ec4899","bg":"#fce7f3","text":"#db2777"}' onclick="selectColorOption(this)"></div>
                        <div class="color-option w-8 h-8 rounded-full bg-[#f97316] cursor-pointer" data-color='{"color":"#f97316","bg":"#ffedd5","text":"#ea580c"}' onclick="selectColorOption(this)"></div>
                    </div>
                </div>
                <div class="flex space-x-3">
                    <button type="button" onclick="closeAddCategoryModal()" class="flex-1 py-3.5 rounded-xl font-bold text-slate-500 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors btn-bouncy">Hủy</button>
                    <button type="button" onclick="saveNewCategory()" class="flex-1 py-3.5 rounded-xl font-bold text-white bg-brand-primary hover:bg-brand-primaryHover transition-colors shadow-md btn-bouncy">Tạo mới</button>
                </div>
            </div>
        </div>
    </main>

    <script src="layout.js"></script>
    <script src="app.js"></script>
</body>
</html>
