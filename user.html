<!DOCTYPE html>
<html lang="vi">
<head><script>(function(){try{var t=localStorage.getItem('finance_buddy_theme')||'system';var d=t==='dark'||(t==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d)}catch(e){}})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân - Quản Lý Chi Tiêu</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Quicksand', 'sans-serif'] }, colors: { brand: { bgDark: '#0f172a', cardDark: '#1e293b', bgLight: '#f8fafc', cardLight: '#ffffff', primary: '#8b5cf6', primaryHover: '#7c3aed', expense: '#f43f5e', income: '#10b981' } }, boxShadow: { 'bubbly': '0 10px 25px -5px rgba(0, 0, 0, 0.1)', 'bubbly-dark': '0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3)' } } } }</script>
    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="enhancements.css">
</head>

<body class="bg-brand-bgLight text-slate-800 dark:bg-brand-bgDark dark:text-slate-200 h-[100dvh] flex overflow-hidden selection:bg-brand-primary selection:text-white">

    <main class="flex-1 flex flex-col h-full overflow-hidden relative bg-slate-50 dark:bg-slate-900/50">
        <!-- HEADER MOBILE -->
        <header class="md:hidden flex items-center justify-center p-4 bg-brand-cardLight dark:bg-brand-cardDark shadow-sm z-20 rounded-b-3xl relative">
            <h1 class="font-extrabold text-xl text-transparent bg-clip-text bg-gradient-to-r from-brand-primary to-pink-500">Finance Buddy</h1>
            <a href="user.html" class="absolute right-4 w-9 h-9 rounded-full bg-brand-primary cursor-pointer border-2 border-white dark:border-slate-700 shadow ring-2 ring-brand-primary">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix&backgroundColor=b6e3f4" alt="avatar" class="w-full h-full rounded-full layout-user-avatar">
            </a>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8 relative scroll-smooth" id="main-scroll-area">
            <section class="max-w-2xl mx-auto animate-view">
                
                <div class="flex items-center mb-8 bg-brand-cardLight dark:bg-brand-cardDark p-4 rounded-2xl shadow-sm">
                    <a href="index.html" class="w-12 h-12 rounded-xl bg-slate-100 dark:bg-slate-700 shadow flex items-center justify-center text-slate-600 dark:text-slate-300 hover:text-brand-primary hover:bg-slate-200 btn-bouncy mr-4 transition-colors"><i class="fas fa-arrow-left text-xl"></i></a>
                    <div><h2 class="font-extrabold text-2xl text-slate-800 dark:text-white leading-tight">Hồ Sơ Của Bạn</h2><p class="text-sm text-slate-500 dark:text-slate-400 font-medium">Tùy chỉnh thông tin và sở thích cá nhân</p></div>
                </div>

                <!-- THANH CHUYỂN ĐỔI NGƯỜI DÙNG (WORKSPACE) -->
                <div class="flex bg-slate-100 dark:bg-slate-800 p-1.5 rounded-2xl mb-3 relative shadow-inner w-full max-w-sm mx-auto">
                    <div id="workspace-indicator" class="absolute inset-y-1.5 left-1.5 w-[calc(50%-4px)] bg-white dark:bg-slate-600 rounded-xl transition-all duration-300 shadow-md"></div>
                    <button onclick="setWorkspace('user1')" id="tab-ws-user1" class="flex-1 py-2 text-sm font-bold z-10 transition-colors text-brand-primary">Người A</button>
                    <button onclick="setWorkspace('user2')" id="tab-ws-user2" class="flex-1 py-2 text-sm font-bold z-10 transition-colors text-slate-500 dark:text-slate-400">Người B</button>
                </div>
<div class="bg-brand-cardLight dark:bg-brand-cardDark rounded-[2rem] p-8 shadow-bubbly dark:shadow-bubbly-dark flex flex-col items-center relative overflow-hidden border border-slate-100 dark:border-slate-800">
                    <div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-r from-cyan-400 via-brand-primary to-pink-500 opacity-20"></div>

                    <div class="w-32 h-32 rounded-full bg-gradient-to-tr from-brand-primary to-pink-500 flex items-center justify-center mb-4 relative shadow-[0_10px_25px_rgba(0,0,0,0.2)] mt-8 z-10 border-4 border-white dark:border-brand-cardDark group">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix&backgroundColor=b6e3f4" alt="avatar" class="w-full h-full rounded-full bg-white group-hover:opacity-80 transition-opacity layout-user-avatar">
                        <button type="button" onclick="openAvatarPicker()" class="absolute bottom-0 right-0 bg-brand-cardLight dark:bg-slate-700 text-brand-primary p-3 rounded-full shadow-lg border-2 border-white dark:border-slate-800 btn-bouncy hover:bg-slate-50 transition-colors" aria-label="Chọn ảnh đại diện"><i class="fas fa-camera text-lg"></i></button>
                    </div>
                    
                    <h3 class="text-3xl font-extrabold mb-1 mt-2 z-10 text-slate-800 dark:text-white layout-user-name">Khách Hàng</h3>
                    <p class="text-brand-primary font-bold bg-brand-primary/10 px-3 py-1 rounded-full text-sm mb-8 z-10">Thành viên từ 2024</p>

                    <form class="w-full space-y-6 bg-slate-50 dark:bg-slate-800/50 p-6 rounded-3xl border border-slate-100 dark:border-slate-700">
                        <div>
                            <label class="block text-sm font-extrabold text-slate-500 mb-2 uppercase tracking-wide">Tên hiển thị</label>
                            <div class="relative group">
                                <i class="fas fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 group-focus-within:text-brand-primary transition-colors"></i>
                                <input id="profile-display-name" type="text" value="Người A" class="w-full bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 rounded-xl py-3 pl-12 pr-4 focus:outline-none focus:border-brand-primary font-bold text-lg text-slate-800 dark:text-slate-100 transition-colors shadow-inner layout-user-name">
                            </div>
                        </div>
<button type="button" onclick="saveCurrentProfile();" class="w-full bg-gradient-to-r from-slate-800 to-slate-700 dark:from-white dark:to-slate-200 text-white dark:text-slate-900 font-extrabold text-lg py-4 rounded-xl mt-6 btn-bouncy shadow-lg flex justify-center items-center hover:opacity-90 transition-opacity">
                            <i class="fas fa-save mr-2 text-xl"></i> LƯU THAY ĐỔI
                        </button>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <div id="avatar-picker-modal" class="fixed inset-0 z-[120] hidden items-center justify-center p-4 bg-slate-950/60" onclick="if(event.target===this){this.classList.add('hidden');this.classList.remove('flex')}">
        <div class="w-full max-w-lg max-h-[85dvh] overflow-y-auto rounded-3xl bg-white dark:bg-slate-800 p-5 shadow-2xl">
            <div class="flex items-center justify-between mb-4"><h3 class="text-xl font-extrabold">Chọn ảnh đại diện</h3><button type="button" onclick="document.getElementById('avatar-picker-modal').classList.add('hidden');document.getElementById('avatar-picker-modal').classList.remove('flex')" class="p-2 rounded-lg"><i class="fas fa-times"></i></button></div>
            <p class="text-sm text-slate-500 mb-4">Chọn một trong 30 ảnh đại diện. Ảnh tải từ DiceBear khi có Internet.</p>
            <div id="avatar-picker-grid" class="grid grid-cols-4 sm:grid-cols-5 gap-2"></div>
        </div>
    </div>
    <!-- Firebase đồng bộ đám mây (tùy chọn; cần cấu hình firebase-config.js) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="firebase-sync.js"></script>
    <script src="layout.js"></script>
    <script src="app.js"></script>
    <script src="enhancements.js"></script>
    <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('PWA service worker:', err)));</script>
</body>
</html>
