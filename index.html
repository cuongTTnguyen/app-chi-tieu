<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Quản Lý Chi Tiêu</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Quicksand', 'sans-serif'] }, colors: { brand: { bgDark: '#0f172a', cardDark: '#1e293b', bgLight: '#f8fafc', cardLight: '#ffffff', primary: '#8b5cf6', primaryHover: '#7c3aed', expense: '#f43f5e', income: '#10b981' } }, boxShadow: { 'bubbly': '0 10px 25px -5px rgba(0, 0, 0, 0.1)', 'bubbly-dark': '0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3)' } } } }</script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-brand-bgLight text-slate-800 dark:bg-brand-bgDark dark:text-slate-200 h-[100dvh] flex overflow-hidden selection:bg-brand-primary selection:text-white">

    <main class="flex-1 flex flex-col h-full overflow-hidden relative bg-slate-50 dark:bg-slate-900/50">
        <!-- HEADER MOBILE -->
        <header class="md:hidden flex items-center justify-center p-4 bg-brand-cardLight dark:bg-brand-cardDark shadow-sm z-20 rounded-b-3xl relative">
            <h1 class="font-extrabold text-xl text-transparent bg-clip-text bg-gradient-to-r from-brand-primary to-pink-500">Finance Buddy</h1>
            <a href="user.html" class="absolute right-4 w-9 h-9 rounded-full bg-brand-primary cursor-pointer border-2 border-white dark:border-slate-700 shadow">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix&backgroundColor=b6e3f4" alt="avatar" class="w-full h-full rounded-full">
            </a>
        </header>

        <!-- CONTAINER NỘI DUNG CHÍNH -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8 relative scroll-smooth" id="main-scroll-area">
            <section class="max-w-4xl mx-auto animate-view">
                
                <!-- Card Tổng Số Dư -->
                <div class="bg-gradient-to-br from-brand-primary via-purple-600 to-pink-500 rounded-[2rem] p-8 text-white shadow-bubbly dark:shadow-bubbly-dark mb-8 relative overflow-hidden group">
                    <div class="absolute -top-10 -right-10 w-40 h-40 rounded-full bg-white opacity-10 group-hover:scale-110 transition-transform duration-500"></div>
                    <div class="absolute -bottom-10 -left-10 w-32 h-32 rounded-full bg-white opacity-10 group-hover:scale-110 transition-transform duration-500"></div>
                    
                    <div class="relative z-10">
                        <div class="flex justify-between items-center mb-2">
                            <p class="text-base font-semibold opacity-90 tracking-wide">TỔNG SỐ TIỀN ĐANG CÓ</p>
                            <i class="fas fa-gem text-2xl opacity-80"></i>
                        </div>
                        <h2 class="text-5xl md:text-6xl font-extrabold tracking-tight mb-6 drop-shadow-md" id="main-balance">0đ</h2>
                        
                        <div class="flex flex-wrap gap-4 bg-white/20 p-4 rounded-3xl backdrop-blur-md border border-white/30 w-max shadow-inner">
                            <div class="flex items-center space-x-3 pr-2">
                                <div class="w-10 h-10 rounded-xl bg-white text-brand-income flex items-center justify-center shadow-md"><i class="fas fa-arrow-down text-lg"></i></div>
                                <div><p class="text-xs font-bold opacity-80 uppercase tracking-wider">Tổng thu</p><p class="font-extrabold text-base drop-shadow-sm" id="main-total-income">0đ</p></div>
                            </div>
                            <div class="w-px h-10 bg-white/40 mx-2 hidden md:block"></div>
                            <div class="flex items-center space-x-3 pl-2">
                                <div class="w-10 h-10 rounded-xl bg-white text-brand-expense flex items-center justify-center shadow-md"><i class="fas fa-arrow-up text-lg"></i></div>
                                <div><p class="text-xs font-bold opacity-80 uppercase tracking-wider">Tổng chi</p><p class="font-extrabold text-base drop-shadow-sm" id="main-total-expense">0đ</p></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Khu Vực Biểu Đồ & Thống Kê -->
                <div class="bg-brand-cardLight dark:bg-brand-cardDark rounded-[2rem] p-6 shadow-bubbly dark:shadow-bubbly-dark border border-slate-100 dark:border-slate-800">
                    <div class="flex flex-col lg:flex-row gap-8">
                        
                        <div class="flex-1">
                            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4 bg-slate-50 dark:bg-slate-800/50 p-2 rounded-2xl border border-slate-100 dark:border-slate-700">
                                <div class="flex w-full sm:w-auto bg-slate-200 dark:bg-slate-700 rounded-xl p-1 relative">
                                    <div id="chart-tab-indicator" class="absolute inset-y-1 left-1 w-[calc(50%-4px)] bg-white dark:bg-slate-600 rounded-lg shadow transition-all duration-300"></div>
                                    <button onclick="setChartMode('expense')" id="btn-mode-expense" class="flex-1 sm:flex-none px-6 py-2.5 rounded-lg text-sm font-bold transition-colors z-10 text-brand-expense">Chi Phí</button>
                                    <button onclick="setChartMode('income')" id="btn-mode-income" class="flex-1 sm:flex-none px-6 py-2.5 rounded-lg text-sm font-bold transition-colors z-10 text-slate-500 dark:text-slate-400">Thu Nhập</button>
                                </div>

                                <div class="relative w-full sm:w-40">
                                    <select id="time-filter" onchange="updateChartData()" class="w-full appearance-none bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200 text-sm font-bold rounded-xl py-2.5 pl-4 pr-10 focus:ring-2 focus:ring-brand-primary outline-none shadow-sm cursor-pointer transition-shadow">
                                        <option value="day">Hôm nay</option><option value="week">Tuần này</option><option value="month" selected>Tháng này</option><option value="year">Năm nay</option><option value="all">Toàn thời gian</option>
                                    </select>
                                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400"><i class="fas fa-chevron-down text-sm"></i></div>
                                </div>
                            </div>

                            <div class="relative h-72 w-full flex items-center justify-center">
                                <canvas id="mainChart"></canvas>
                                <div id="chart-empty-state" class="absolute inset-0 flex flex-col items-center justify-center hidden rounded-2xl glass-panel z-10 bg-white/70 dark:bg-slate-800/70">
                                    <div class="w-16 h-16 bg-slate-100 dark:bg-slate-700 rounded-full flex items-center justify-center mb-3"><i class="fas fa-box-open text-2xl text-slate-400"></i></div>
                                    <p class="text-slate-500 dark:text-slate-400 font-bold">Chưa có số liệu</p>
                                </div>
                            </div>
                        </div>

                        <div class="w-full lg:w-72 flex flex-col">
                            <h3 class="font-extrabold text-lg mb-4 text-slate-700 dark:text-slate-200 flex items-center border-b-2 border-slate-100 dark:border-slate-700 pb-2">
                                <i class="fas fa-list-ul mr-2 text-brand-primary"></i> <span id="breakdown-title">Chi tiết phân bổ</span>
                            </h3>
                            <div id="breakdown-list" class="space-y-2 overflow-y-auto max-h-72 pr-2 custom-scrollbar"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- TRÌNH TỰ SCRIPT: Layout Helper luôn phải đứng trước app.js -->
    <script src="layout.js"></script>
    <script src="app.js"></script>
</body>
</html>
